documentationUrl: https://docsurl.com
connectionSpecification:
  $schema: http://json-schema.org/draft-07/schema#
  title: Adjust Custom Spec
  type: object
  required:
    - api_token
    - start_date
    - utc_offset
    - chunk_date_range
  properties:
    api_token:
      title: API Token
      type: string
      order: 1
      description: API Token. See <a href="https://dev.adjust.com/en/api/rs-api/authentication">here</a>
      airbyte_secret: True
    start_date:
      title: Start Date
      type: string
      order: 2
      description: Start Date in YYYY-MM-DD
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
      pattern_descriptor: "YYYY-MM-DD"
      format: date
    utc_offset:
      title: UTC Offset
      type: integer
      order: 3
      description: UTC Offset is used in request params as the utc_offset parameter. See <a href="https://dev.adjust.com/en/api/rs-api/reports">here</a>
      default: 0
    chunk_date_range:
      title: Chunk Date Range
      type: integer
      order: 4
      description: >- 
        Chunk Date Range is used to split the date range into smaller requests. The default value is 7 days.
        If you experience error "You requested too much data (greater than 1500000 rows)", please try to descrease this value.
      minimum: 1
      default: 7
    custom_report_dimensions:
      title: Custom Report Dimensions
      type: string
      order: 5
      description: >- 
        Comma-separated values of Dimensions. See <a href="https://dev.adjust.com/en/api/rs-api/reports#dimensions">here</a>. Example: "os_name, campaign, adgroup". 
        Default always contains "day, app, store_id".
    custom_report_metrics:
      title: Custom Report Metrics
      type: string
      order: 6
      description: >- 
        Comma-separated values of Metrics. See <a href="https://dev.adjust.com/en/api/rs-api/reports#metrics">here</a>. Example: "impressions, clicks". 
        Default always contains "cost, installs, ad_revenue".
    get_last_X_days:
      title: Get last X days data
      type: boolean
      order: 7
      description: >-
        **Important** This fuction ignores your Start Date and only Get last X days data for both full-refresh and incremental method, X = Number of days backward. For example, if you fill 7 in Number of days backwards, and choose this option as True, all streams will record last 7 days data from today in your chosen Timezone below. 
      default: false
    number_days_backward:
      title: Number of days backward to get data
      type: integer
      order: 8
      description: >-
        Number of days backward to get data for daily incremental sync, default is 7. If you choose Get Last X Days is False, then all incremental streams will get data from date of last sync minus number of days backward.
      minimum: 1
      default: 7
    timezone:
      title: Your local timezone
      type: string
      order: 9
      description: Default is UTC, get timezone name in <a href="https://en.wikipedia.org/wiki/List_of_tz_database_time_zones">here</a>
    ad_revenue_sources:
      title: Ad Revenue Sources Filter
      type: string
      order: 10
      description: Filter ad revenue sources, get list of ad revenue sources in <a href="https://dev.adjust.com/en/api/rs-api/reports#dimensions">here</a>